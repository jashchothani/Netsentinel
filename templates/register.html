<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | NetSentinel Security</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="login-container">
        <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

        <div class="login-box fade-in-up">
            <div class="login-header">
                <div class="logo-icon"><i class="fa-solid fa-user-shield"></i></div>
                <h2>Create Account</h2>
                <p>Join NetSentinel to secure your network</p>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="flash-messages">
                  {% for message in messages %}
                    <p class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> {{ message }}</p>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}

            <form method="POST" action="/register" class="login-form">
                
                <div class="input-group">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" name="username" required autocomplete="off">
                    <label for="username">Username</label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email" required autocomplete="off">
                    <label for="email">Email Address</label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" required>
                    <label for="password">Password</label>
                    <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>

                <button type="submit" class="btn btn-primary login-submit-btn">
                    <span>Sign Up</span>
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>
            
            <p class="signup-link">Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>

    <script src="/static/login.js"></script>

</body>
</html>
