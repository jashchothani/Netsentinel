<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NetSentinel Security</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="login-container">
        <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

        <div class="login-box fade-in-up">
            <div class="login-header">
                {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="flash-messages">
                  {% for message in messages %}
                    <p class="error-msg"><i class="fa-solid fa-circle-exclamation"></i> {{ message }}</p>
                  {% endfor %}
                </div>
              {% endif %}
            {% endwith %}
                <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <h2>Welcome Back</h2>
                <p>Login to your NetSentinel dashboard</p>
            </div>

            <form method="POST" class="login-form">
                
                <div class="input-group">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="username" name="username" required autocomplete="off">
                    <label for="username">Username</label>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" required>
                    <label for="password">Password</label>
                    <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>
                    <a href="{{ url_for('forgot_password') }}" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary login-submit-btn">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            
            <p class="signup-link">Don't have an account? <a href="/register">Create It!!</a></p>
        </div>
    </div>

    <script src="/static/login.js"></script>

</body>
</html>
